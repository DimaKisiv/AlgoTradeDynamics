services:
  db:
    image: postgres:16-alpine
    container_name: algotrade_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: algotrade
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d algotrade"]
      interval: 5s
      timeout: 5s
      retries: 10

  exchange-emulator:
    build: ./EXCHANGE_EMULATOR
    container_name: algotrade_exchange_emulator
    environment:
      EMULATOR_DATABASE_URL: sqlite:////data/emulator.db
      EMULATOR_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000
      BYBIT_PUBLIC_API_URL: https://api.bybit.com
      EMULATOR_SEED_DATA_DIR: /seed-data
    ports:
      - "8001:8001"
    volumes:
      - emulator_data:/data
      - ./EXCHANGE_EMULATOR/app:/app/app
      - ./BE/data:/seed-data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./BE
    container_name: algotrade_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/algotrade
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      LOG_LEVEL: INFO
      ENVIRONMENT: development
      JWT_SECRET_KEY: dev-secret-change-me-0123456789abcdef0123456789abcdef
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      REFRESH_COOKIE_NAME: atd_refresh_token
      REFRESH_COOKIE_SECURE: "false"
      REFRESH_COOKIE_SAMESITE: lax
      EXCHANGE_EMULATOR_URL: http://exchange-emulator:8001
      EXCHANGE_EMULATOR_DEFAULT_API_KEY: emulator-default-key
      BYBIT_DEMO_API_KEY: ${BYBIT_DEMO_API_KEY:-}
      BYBIT_DEMO_API_SECRET: ${BYBIT_DEMO_API_SECRET:-}
    ports:
      - "8000:8000"
    volumes:
      - ./BE/app:/app/app
      - ./BE/data:/app/data
      - ./BE/alembic:/app/alembic
    depends_on:
      db:
        condition: service_healthy
      exchange-emulator:
        condition: service_healthy

  frontend:
    build: ./FE
    container_name: algotrade_frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
      VITE_EMULATOR_BASE_URL: http://localhost:8001
    ports:
      - "5173:5173"
    volumes:
      - ./FE/src:/app/src
      - ./FE/public:/app/public
      - ./FE/index.html:/app/index.html
      - ./FE/vite.config.js:/app/vite.config.js
    depends_on:
      - backend
      - exchange-emulator

volumes:
  pgdata:
  emulator_data:
